<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="goldChest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#neonBlue)" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- 5x5 Grid Motif -->
  <g opacity="0.3" stroke="#38bdf8" stroke-width="2">
    <line x1="136" y1="116" x2="136" y2="396" stroke-dasharray="4 4" />
    <line x1="206" y1="116" x2="206" y2="396" stroke-dasharray="4 4" />
    <line x1="276" y1="116" x2="276" y2="396" stroke-dasharray="4 4" />
    <line x1="346" y1="116" x2="346" y2="396" stroke-dasharray="4 4" />
    <line x1="116" y1="176" x2="396" y2="176" stroke-dasharray="4 4" />
    <line x1="116" y1="246" x2="396" y2="246" stroke-dasharray="4 4" />
    <line x1="116" y1="316" x2="396" y2="316" stroke-dasharray="4 4" />
  </g>

  <!-- Central Diamond / Safe Gem Shield with Glow -->
  <polygon points="256,120 376,240 256,360 136,240" fill="url(#neonBlue)" filter="url(#glow)" />
  <polygon points="256,140 356,240 256,340 156,240" fill="#0f172a" />
  
  <!-- Center Star / Radar Crosshair -->
  <circle cx="256" cy="240" r="32" fill="none" stroke="#38bdf8" stroke-width="4" />
  <line x1="256" y1="190" x2="256" y2="290" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  <line x1="206" y1="240" x2="306" y2="240" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  <circle cx="256" cy="240" r="8" fill="#38bdf8" />

  <!-- Text Monogram MINES AI -->
  <text x="256" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="6" fill="#f8fafc">MINES AI</text>
  <text x="256" y="448" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" letter-spacing="4" fill="#38bdf8" opacity="0.8">WIN10K ANALYZER</text>
</svg>
